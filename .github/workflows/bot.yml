name: Bot Radio Reloj 1

on:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar-musica:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Ejecutar bot de radio
        shell: pwsh
        run: ./capturar.ps1

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "Bot Radio"
          git config user.email "bot@://github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Actualizacion Reloj 1" && git pull --rebase && git push)
