name: Bot Radio Reloj 3 (10-30-50)

on:
  schedule:
    - cron: '10,30,50 * * * *'
  workflow_dispatch:

concurrency:
  group: guardar-canciones
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capturar-musica:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
      - name: Ejecutar bot de radio
        shell: pwsh
        run: ./capturar.ps1
      - name: Guardar cambios en GitHub
        run: |
          git config user.name "Bot Radio"
          git config user.email "bot@://github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Actualizacion Reloj 3" && git pull --rebase && git push)
